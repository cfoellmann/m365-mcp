[project]
name = "m365-mcp"
version = "0.1.5"
description = "Schmaler MCP-Server für Microsoft 365 (Mail, Kalender, To Do, Planner) mit im Code erzwungenen Richtlinien"
readme = "README.md"
requires-python = ">=3.13"
license = "MIT"
dependencies = [
    "mcp>=2.3,<3",
    "msal>=1.39,<2",
    "httpx>=0.28,<0.29",
]

[project.scripts]
m365-mcp = "m365_mcp.cli:main"

[dependency-groups]
# tzdata nur für die Entwicklung unter Windows (zoneinfo); Linux bringt die Zeitzonendaten mit.
dev = ["pytest>=9", "ruff>=0.16", "tzdata"]

[build-system]
requires = ["uv_build>=0.13,<0.14"]
build-backend = "uv_build"

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
